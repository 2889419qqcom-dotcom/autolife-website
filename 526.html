<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>AUTOLIFE CONSTELLATION</title>


<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

width:100vw;
height:100vh;

overflow:hidden;

background:#030303;

color:white;

font-family:Arial,Helvetica,sans-serif;

}



.space{

position:absolute;

inset:0;


background:

radial-gradient(

circle at center,

#222,

#000 70%

);

}




header{


position:absolute;


top:40px;


left:50px;


right:50px;


display:flex;


justify-content:space-between;


z-index:100;


}


.logo{

font-size:20px;

letter-spacing:10px;

font-weight:bold;

}


.nav{

font-size:12px;

letter-spacing:6px;

opacity:.5;

}






.center{


position:absolute;


left:50%;


top:50%;


transform:

translate(-50%,-50%);



z-index:50;


text-align:center;


pointer-events:none;


}



.center h1{

font-size:70px;

font-weight:900;

letter-spacing:-5px;

}



.center p{


margin-top:20px;


font-size:12px;


letter-spacing:8px;


opacity:.5;


}








.orbit{


position:absolute;


left:50%;


top:50%;


width:0;


height:0;


transform:

translate(-50%,-50%);


z-index:20;


perspective:1600px;


}




.orbit-inner{


position:absolute;


transform:

rotate(-15deg);


transform-style:preserve-3d;


}






.item{


position:absolute;


width:260px;


height:160px;


margin-left:-130px;


margin-top:-80px;


border-radius:12px;


overflow:hidden;


cursor:pointer;


z-index:2;


transition:


opacity .5s ease,

transform .6s ease;


}



.item img{


width:100%;


height:100%;


object-fit:cover;


display:block;


filter:

grayscale(100%);



transition:

transform .5s ease,

filter .5s ease;


}






/* hover */


.item.active-hover{


z-index:500;


}



.item.active-hover img{


filter:

grayscale(0%);


transform:

scale(1.2);


}




.item.inactive-hover{


opacity:.25;


}







/* 点击生成的顶层卡片 */

.focus-card{


position:fixed;


left:50%;


top:50%;


width:75vw;


height:75vh;


z-index:999999;


border-radius:20px;


overflow:hidden;


box-shadow:

0 60px 150px rgba(0,0,0,.8);



transform:

translate(-50%,-50%)

rotate(0deg)

scale(.2);



animation:

focusIn .8s cubic-bezier(.2,.8,.2,1)

forwards;


}




.focus-card img{


width:100%;


height:100%;


object-fit:cover;


filter:

grayscale(0%);


}





@keyframes focusIn{


from{


transform:

translate(-50%,-50%)

rotate(15deg)

scale(.2);


opacity:0;


}


to{


transform:

translate(-50%,-50%)

rotate(0deg)

scale(1);


opacity:1;


}

}





</style>

</head>



<body>



<div class="space"></div>




<header>


<div class="logo">

AUTOLIFE

</div>


<div class="nav">

ROBOTICS / AI / FUTURE

</div>


</header>






<div class="center">


<h1>

CONSTELLATION

</h1>


<p>

INTELLIGENT LIFE SYSTEM

</p>


</div>








<div class="orbit">


<div class="orbit-inner">



<div class="item">

<img src="assets/1.jpg">

</div>


<div class="item">

<img src="assets/2.jpg">

</div>


<div class="item">

<img src="assets/3.jpg">

</div>


<div class="item">

<img src="assets/4.jpg">

</div>


<div class="item">

<img src="assets/5.jpg">

</div>


<div class="item">

<img src="assets/6.jpg">

</div>


<div class="item">

<img src="assets/7.jpg">

</div>


<div class="item">

<img src="assets/8.jpg">

</div>



</div>

</div>







<script>


const items=document.querySelectorAll(".item");


let angle=0;

let speed=0.0008;


let radiusX=420;

let radiusY=180;


let hoverPause=false;


let focusCard=null;







function animate(){



if(!hoverPause){

angle+=speed;

}




items.forEach((item,index)=>{


let a=

angle+

index*(Math.PI*2/items.length);




let x=

Math.cos(a)*radiusX;



let y=

Math.sin(a)*radiusY;





let depth=

(Math.sin(a)+1)/2;




let z=

(depth-0.5)*900;




let scale=

0.45+

depth*0.8;




item.style.transform=

`

translate3d(

${x}px,

${y}px,

${z}px

)

scale(${scale})

rotate(15deg)

`;



});




requestAnimationFrame(animate);


}



animate();








items.forEach(item=>{


item.onclick=()=>{


if(focusCard){


focusCard.remove();


focusCard=null;


hoverPause=false;


return;


}



hoverPause=true;



focusCard=item.cloneNode(true);


focusCard.classList.remove("item");


focusCard.classList.add("focus-card");



document.body.appendChild(focusCard);



};



});


// hover 图片变彩色

items.forEach(item=>{


item.addEventListener(
"mouseenter",
()=>{


// 如果已经打开详情，不执行

if(focusCard){

return;

}


// 停止旋转

hoverPause=true;



// 当前图片彩色

item.classList.add("active-hover");



// 其他图片变暗

items.forEach(other=>{


if(other!==item){

other.classList.add("inactive-hover");

}


});


});






item.addEventListener(
"mouseleave",
()=>{


if(focusCard){

return;

}



// 恢复旋转

hoverPause=false;



// 清除状态

items.forEach(other=>{


other.classList.remove("inactive-hover");


});



item.classList.remove("active-hover");



});


});



</script>



</body>

</html>
